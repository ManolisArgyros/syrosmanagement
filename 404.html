<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 | Syros Management</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#173B36">
<link rel="preload" href="/fonts/kh-greek.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/kh-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:KH;font-style:normal;font-weight:680;font-display:optional;src:url(/fonts/kh-greek.woff2) format("woff2");unicode-range:U+0370-03FF}
@font-face{font-family:KH;font-style:normal;font-weight:680;font-display:optional;src:url(/fonts/kh-latin.woff2) format("woff2");unicode-range:U+0020-007E,U+2013-2014,U+2018-201D,U+2026,U+20AC}
:root{--sys:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;--hd:KH,var(--sys);--g:#173B36;--o:#E0A93B;--o2:#EDBB55}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--g);color:#F3EFE6;font:400 18px/1.62 var(--sys);-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px}
.bar{display:flex;align-items:center;height:76px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;font:680 1.25rem/1 var(--hd);letter-spacing:-.02em}
main{flex:1;display:flex;align-items:center}
.box{display:flex;flex-direction:column;gap:14px;max-width:640px;padding:40px 0 64px}
.code{font:680 clamp(4rem,12vw,7rem)/1 var(--hd);color:var(--o);letter-spacing:-.04em}
h1,h2{margin:0;font-family:var(--hd);font-weight:680;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(1.8rem,4vw,2.6rem)}
h2{font-size:1.25rem;margin-top:22px;color:#C9D6D1}
p{margin:0;color:#C9D6D1}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 24px;border-radius:14px;font-weight:600;font-size:1.04rem;text-decoration:none}
.btn-o{background:var(--o);color:#1A1A12}.btn-o:hover{background:var(--o2)}
.btn-l{background:rgba(255,255,255,.1);color:#F3EFE6}.btn-l:hover{background:rgba(255,255,255,.18)}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<header class="wrap"><div class="bar"><a class="logo" href="/"><svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="11.5" stroke="currentColor" stroke-width="3" stroke-dasharray="58 14.3" stroke-linecap="round" transform="rotate(-60 16 16)"/><circle cx="16" cy="16" r="4" fill="#E0A93B"/></svg>Syros Management</a></div></header>
<main class="wrap"><div class="box">
<span class="code" aria-hidden="true">404</span>
<h1>Η σελίδα δεν βρέθηκε</h1>
<p>Ο σύνδεσμος δεν υπάρχει ή έχει αλλάξει. Γυρίστε στην αρχική και διαλέξτε από εκεί.</p>
<div class="btns"><a class="btn btn-o" href="/">Μετάβαση στην αρχική</a></div>
<h2 lang="en">Page not found</h2>
<p lang="en">This link does not exist or has moved. Go back to the home page and choose from there.</p>
<div class="btns"><a class="btn btn-l" href="/en/" lang="en" hreflang="en">Go to the English home page</a></div>
</div></main>
</body>
</html>
